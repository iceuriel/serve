<!DOCTYPE html>
<!--
    CLIENT PORTAL — one customer, every booking, one link that never changes.

        /h?id=CON-0007&t=<token>

    NOT ONE PAGE PER CUSTOMER. This file takes a contact id, asks /api/portal
    for that person, and renders it. Ten customers or ten thousand, it is this
    file and nothing else.

    THE SERVER DECIDES WHAT MAY BE SEEN, not this page. The response carries
    only that contact's bookings and homes, and it never carries a door code —
    only whether one is saved and when. If filtering happened here, everything
    would have to be sent and the page trusted not to render it.

    NOINDEX is in the markup AND as X-Robots-Tag on /h in _headers. The header
    is the one that counts. Referrer-Policy: no-referrer is set there too, and
    matters more than either: the token is in the URL, and a referrer header
    would hand it to every site the customer clicks through to.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">
    <title>Your Serve</title>
    <!-- START THE REQUEST NOW, NOT AFTER EVERYTHING ELSE HAS LOADED.  r44
         Page scripts sit at the end of <body>, so the request for this page's
         data used to begin only once the stylesheet and every script had
         downloaded — on a phone opening a link from a text, the slowest stretch
         of the whole load, spent doing nothing. This starts it immediately, in
         parallel with them. The page script adopts the answer only if it would
         have asked for exactly the same address, and asks again itself if not,
         so a mismatch costs the head start and never the page.
         It must stay ABOVE the stylesheet link: a script after a stylesheet
         waits for that stylesheet. It reads nothing the page script does not
         already read, and stores nothing. -->
    <script>
    (function () {
        try {
            var q = new URLSearchParams(location.search);
            var id = q.get('id') || '', t = q.get('t') || '';
            if (!id || !t) return;
            var url = '/api/portal?id=' + encodeURIComponent(id) + '&t=' + encodeURIComponent(t);
            var answer = fetch(url).then(function (r) { return r.json(); });
            answer.catch(function () {});   /* reported by the page script, not here */
            window.ServeFirstLoad = { url: url, answer: answer };
        } catch (_) { /* no early start; the page script asks as it always did */ }
    })();
    </script>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body class="ticket-body">

    <main class="portal" id="portal">
        <header class="ticket__bar">
            <a href="/" class="ticket__brand">Serve</a>
            <span class="portal__for" id="p-for"></span>
        </header>

        <!-- THE SHAPE OF THE PAGE, BEFORE ITS DATA.  r44
             Painted with the first frame instead of a bare "Loading…". Nothing
             in it can outlive the load: fail() writes its message over the
             whole element and start() hides it. -->
        <div class="ticket__state" id="p-state" role="status">
            <span class="sr-only">Loading your bookings&hellip;</span>
            <div class="skel" aria-hidden="true">
                <div class="skel__tabs">
                    <span class="skel__bar skel__bar--tab"></span>
                    <span class="skel__bar skel__bar--tab"></span>
                </div>
                <span class="skel__bar skel__bar--heading"></span>
                <div class="skel__card">
                    <span class="skel__bar skel__bar--line"></span>
                    <span class="skel__bar skel__bar--short"></span>
                </div>
                <div class="skel__card">
                    <span class="skel__bar skel__bar--line"></span>
                    <span class="skel__bar skel__bar--short"></span>
                </div>
                <div class="skel__card">
                    <span class="skel__bar skel__bar--line"></span>
                    <span class="skel__bar skel__bar--short"></span>
                </div>
                <p class="skel__slow">Still loading&hellip; this can take a few seconds.</p>
            </div>
        </div>

        <!-- Tabs on a phone, a sidebar from 720px. One nav, not two. -->
        <nav class="portal__nav" id="p-nav" hidden aria-label="Sections"></nav>

        <div class="portal__body" id="p-body" hidden></div>

        <footer class="ticket__foot" id="p-foot" hidden>
            <a href="tel:+16178047201">(617) 804-7201</a>
            &middot;
            <a href="mailto:management@servecos.com">management@servecos.com</a>
        </footer>
    </main>

    <script src="serve-scope.js"></script>
    <script src="serve-slots.js"></script>
    <script src="partner-card.js"></script>
    <script src="booking-live.js"></script>
    <script src="booking-photos.js"></script>
    <script src="portal.js"></script>
</body>
</html>
