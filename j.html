<!DOCTYPE html>
<!--
    JOB TICKET — one page, two audiences.

        /j?id=SRV-yyyyMMdd-XXXXXX&t=<token>&view=client|partner

    NOT ONE PAGE PER JOB. This file takes an id, asks /api/job for that row, and
    renders it. Ten jobs or ten thousand, it is this file and nothing else — the
    sheet is the database and this is a viewer pointed at a row.

    THE SERVER DECIDES WHAT EACH VIEW MAY SEE, not this page. A partner response
    never contains the customer's email or phone; a client response never
    contains the crew's access notes. If filtering happened here, both would
    have to be sent and the page trusted not to render one.

    Door codes are not in either response and must not be added. They live in a
    separate Access MASTER file and reach the cleaner by direct message.

    NOINDEX is set in the markup AND as X-Robots-Tag on /j in _headers. The
    header is the one that counts — a meta tag only helps if a crawler renders
    the page, and this URL carries a home address.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Your Serve clean</title>
    <!-- START THE REQUEST NOW, NOT AFTER EVERYTHING ELSE HAS LOADED.  r44
         Page scripts sit at the end of <body>, so the request for this page's
         data used to begin only once the stylesheet and every script had
         downloaded — on a phone opening a link from a text, the slowest stretch
         of the whole load, spent doing nothing. This starts it immediately, in
         parallel with them. The page script adopts the answer only if it would
         have asked for exactly the same address, and asks again itself if not,
         so a mismatch costs the head start and never the page.
         It must stay ABOVE the stylesheet link: a script after a stylesheet
         waits for that stylesheet. It reads nothing the page script does not
         already read, and stores nothing. -->
    <script>
    (function () {
        try {
            var q = new URLSearchParams(location.search);
            var id = q.get('id') || '', t = q.get('t') || '';
            if (!id || !t) return;
            var url = '/api/job?id=' + encodeURIComponent(id) + '&t=' + encodeURIComponent(t) +
                      '&view=' + (q.get('view') === 'partner' ? 'partner' : 'client');
            var answer = fetch(url).then(function (r) { return r.json(); });
            answer.catch(function () {});   /* reported by the page script, not here */
            window.ServeFirstLoad = { url: url, answer: answer };
        } catch (_) { /* no early start; the page script asks as it always did */ }
    })();
    </script>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body class="ticket-body">

    <main class="ticket" id="ticket">
        <header class="ticket__bar">
            <a href="/" class="ticket__brand">Serve</a>
            <span class="ticket__role" id="t-role"></span>
        </header>

        <!-- THE SHAPE OF THE PAGE, BEFORE ITS DATA.  r44
             Painted with the first frame instead of a bare "Loading…". Nothing
             in it can outlive the load: fail() writes its message over the
             whole element and start() hides it. -->
        <div class="ticket__state" id="t-state" role="status">
            <span class="sr-only">Loading this booking&hellip;</span>
            <div class="skel" aria-hidden="true">
                <span class="skel__bar skel__bar--eyebrow"></span>
                <span class="skel__bar skel__bar--time"></span>
                <span class="skel__bar skel__bar--short"></span>
                <div class="skel__block">
                    <span class="skel__bar skel__bar--line"></span>
                    <span class="skel__bar skel__bar--line"></span>
                    <span class="skel__bar skel__bar--short"></span>
                </div>
                <div class="skel__block">
                    <span class="skel__bar skel__bar--line"></span>
                    <span class="skel__bar skel__bar--short"></span>
                </div>
                <p class="skel__slow">Still loading&hellip; this can take a few seconds.</p>
            </div>
        </div>

        <div id="t-body" hidden></div>

        <footer class="ticket__foot" id="t-foot" hidden>
            <a href="tel:+16178047201">(617) 804-7201</a>
            &middot;
            <a href="mailto:management@servecos.com">management@servecos.com</a>
        </footer>
    </main>

    <script src="serve-scope.js"></script>
    <script src="partner-card.js"></script>
    <script src="booking-live.js"></script>
    <script src="booking-photos.js"></script>
    <script src="ticket.js"></script>
</body>
</html>
