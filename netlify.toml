# Netlify configuration — kept as a one-click fallback host.
#
# The live host is Cloudflare Pages, configured in its dashboard with the same
# build command and output directory. Nothing here is Netlify-specific by
# design: the allow-list lives in scripts/build-site.sh and the response headers
# live in _headers, both of which Cloudflare reads too. Switching hosts is
# therefore a DNS change, not a config rewrite.

[build]
  publish = "_site"
  command = "bash scripts/build-site.sh"
