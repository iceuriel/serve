<!-- ============================================================
     Serve — Boston skyline hero background, sails drifting
     Drop this <div> inside your hero wrapper (the one holding the
     logo + headline). The wrapper needs position:relative and
     overflow:hidden; hero content needs position:relative.
     Motion respects prefers-reduced-motion.
     ============================================================ -->

<style>
.hero-boston {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 34%;
  pointer-events: none;
  background: linear-gradient(180deg,
    rgba(20,83,107,0) 0%,
    rgba(20,83,107,0.07) 60%,
    rgba(20,83,107,0.10) 100%);
}
.hero-boston svg {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  width: 100%; height: 100%;
  color: #0f3d52;   /* silhouette tint */
  opacity: 0.16;    /* 0.10 whisper - 0.22 present */
}
@keyframes bskyDrift { from { transform: translateX(0) } to { transform: translateX(1200px) } }
@keyframes bskyBob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-2.5px) } }
.bsky-drift-1 { animation: bskyDrift 96s linear infinite }
.bsky-drift-2 { animation: bskyDrift 132s linear infinite }
.bsky-drift-3 { animation: bskyDrift 78s linear infinite }
.bsky-bob-1 { animation: bskyBob 7.5s ease-in-out infinite }
.bsky-bob-2 { animation: bskyBob 9s ease-in-out infinite }
.bsky-bob-3 { animation: bskyBob 8.2s ease-in-out infinite }
@media (max-width: 768px) {
  .hero-boston { height: 28%; }
  .hero-boston svg { opacity: 0.13; }
}
@media (prefers-reduced-motion: reduce) {
  .hero-boston svg g { animation: none !important }
}
</style>
